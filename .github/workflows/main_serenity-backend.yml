# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy Backend to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # ← always fresh checkout

      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: cd backend && npm install

      - name: Verify auth.js contents    # ← confirm the right file is there
        run: cat backend/src/middleware/auth.js

      - name: Create deployment zip      # ← zip only what's needed, no node_modules
        run: |
          cd backend
          zip -r ../backend-deploy.zip . \
            --exclude "node_modules/*" \
            --exclude ".env" \
            --exclude ".git/*"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}   # ← unique per commit, never cached
          path: backend-deploy.zip
          overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}   # ← matches build job name

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51082FBD50C04172BDE30634834F54C6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4CAB6A7A99BC405B8F8966C147D06124 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_30E141ACF024486CA837B7F438F684C6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'serenity-backend'
          slot-name: 'Production'
          package: backend-deploy.zip   # ← deploy the zip directly

      - name: Set SCM build to false    # ← tell Azure not to re-run npm install
        uses: azure/appservice-settings@v1
        with:
          app-name: 'serenity-backend'
          app-settings-json: '[{"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false"}]'
          
