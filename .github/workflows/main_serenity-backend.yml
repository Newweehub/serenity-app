# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - serenity-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Zip the backend package (no node_modules)
        run: |
          cd backend
          zip -r ../backend-deploy.zip . \
            --exclude "node_modules/*" \
            --exclude "*.git*" \
            --exclude ".env"
          echo "Zip size:"
          ls -lh ../backend-deploy.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BACKEND }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BACKEND }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BACKEND }}

      - name: Wait for App Service to be ready
        run: sleep 60

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy
        continue-on-error: true
        with:
          app-name: 'serenity-backend'
          slot-name: 'Production'
          package: backend-deploy.zip

      - name: Wait and retry if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "First attempt failed, waiting 90s before retry..."
          sleep 90

      - name: Retry deploy if first attempt failed
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'serenity-backend'
          slot-name: 'Production'
          package: backend-deploy.zip
          
